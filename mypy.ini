[mypy]
python_version = 3.11
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

# Marimo cells are `def _(np, nx, ...):` — parameters are runtime deps, not typing imports;
# class annotations like `np.ndarray` are not resolved the usual way.
[mypy-beyond_belief_propagation]
disable_error_code = name-defined, attr-defined, annotation-unchecked
