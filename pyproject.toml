[project]
name = "climate-models-blog"
version = "0.1.0"
description = "Interactive climate modeling notebook with progressive complexity"
authors = [{name = "Tate Staples"}]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
    "marimo[recommended]>=0.20.2",
    "xarray>=2023.0.0",
    "netCDF4>=1.6.0",
    "cftime>=1.6.0",
    "spacy>=3.0.0",
    "altair>=5.0.0",
    "pyzmq>=27.1.0",
    "anywidget>=0.9.0",
    "traitlets>=5.0.0",
    "networkx>=3.0.0",
    "polars>=1.0.0",
    "pydantic>=2.0.0",
    "qiskit>=2.3.1",
    "qiskit-aer>=0.17.2",
    "pylatexenc>=2.10",
    "torch>=2.11.0",
    "nbconvert>=7.17.0",
    "playwright>=1.58.0",
    "entmax>=1.3",
    "scikit-image>=0.26.0",
    "mhc>=0.5.5",
    "opt-einsum>=3.4.0",
    "pygraphviz>=1.14",
]

[tool.uv.workspace]
members = ["tiny_eda_project"]


